<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Birthday animation — live preview</title>
    <link rel="icon" href="../assets/icon.svg" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #1b1917;
        --panel: #262321;
        --ink: #f3efe6;
        --dim: #9c958a;
        --clay: #d97757;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.4 ui-sans-serif, system-ui, 'Segoe UI', sans-serif;
        display: grid;
        grid-template-rows: 1fr auto;
        gap: 14px;
        padding: 18px;
      }
      .stage {
        position: relative;
        min-height: 0;
        display: grid;
        place-items: center;
      }
      canvas {
        display: block;
        /* as wide as the page allows, but never so tall that the controls drop off screen */
        width: min(100%, calc((100vh - 180px) * 16 / 9));
        height: auto;
        aspect-ratio: 16 / 9;
        border-radius: 10px;
        background: #f1ede2;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
        cursor: pointer;
      }
      .status {
        position: absolute;
        inset: auto auto 14px 50%;
        translate: -50% 0;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(20, 18, 17, 0.8);
        color: var(--dim);
        font-size: 12px;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      .status:empty {
        opacity: 0;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 12px;
        max-width: 1100px;
        width: 100%;
        margin: 0 auto;
        padding: 10px 14px;
        border-radius: 12px;
        background: var(--panel);
      }
      button {
        font: inherit;
        color: var(--ink);
        background: #3a3532;
        border: 0;
        border-radius: 8px;
        padding: 7px 14px;
        min-width: 74px;
        cursor: pointer;
      }
      button:hover {
        background: #4a433f;
      }
      button.primary {
        background: var(--clay);
        color: #23160f;
        font-weight: 600;
      }
      input[type='range'] {
        flex: 1;
        accent-color: var(--clay);
      }
      .time {
        font-variant-numeric: tabular-nums;
        color: var(--dim);
        min-width: 96px;
        text-align: right;
      }
      .hint {
        color: var(--dim);
        font-size: 12px;
        text-align: center;
      }
      kbd {
        font: inherit;
        padding: 1px 5px;
        border-radius: 4px;
        background: #3a3532;
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <canvas id="canvas" width="1920" height="1080"></canvas>
      <div class="status" id="status">loading…</div>
    </div>
    <div>
      <div class="bar">
        <button class="primary" id="play">Play</button>
        <input id="seek" type="range" min="0" max="24" step="0.001" value="0" aria-label="Seek" />
        <span class="time" id="time">0.00 / 24.00</span>
        <button id="mute">Sound on</button>
      </div>
      <p class="hint">
        <kbd>Space</kbd> play / pause · <kbd>←</kbd> <kbd>→</kbd> one frame (<kbd>Shift</kbd>: one second) · <kbd>Home</kbd> restart —
        this page plays the same code that <code>npm run render</code> turns into the MP4.
      </p>
    </div>
    <script type="module" src="./preview.js"></script>
  </body>
</html>
